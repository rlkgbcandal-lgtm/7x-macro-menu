
name: Build 7X Macro Menu

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar EXE
        run: pyinstaller --noconfirm --onefile --windowed --name 7X_MACRO_MENU main.py

      - name: Enviar EXE
        uses: actions/upload-artifact@v4
        with:
          name: 7X_MACRO_MENU-Windows
          path: dist/7X_MACRO_MENU.exe
